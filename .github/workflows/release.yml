
name: Build and Release

on:
  push:
    tags:
      - 'build'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libssl-dev \
            libsqlite3-dev \
            libasound2-dev \
            libpulse-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libwayland-dev \
            libx11-dev \
            libxdo-dev \
            libxrandr-dev \
            libxcursor-dev \
            libxi-dev \
            libxinerama-dev \
            libdbus-1-dev \
            libfontconfig1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libgl1-mesa-dev \
            libegl1-mesa-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --locked --release --features linux-tray

      - name: Package
        run: |
          mkdir -p release
          cp target/release/nalei100gram release/
          if [ -d assets ]; then
            cp -r assets release/
          fi
          tar -czf Nalei100Gram-linux-x86_64.tar.gz -C release .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: Nalei100Gram-linux-x86_64.tar.gz

  build-windows:
    name: Build Windows
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --locked --release --features windows-tray

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release
          Copy-Item target/release/nalei100gram.exe release/
          if (Test-Path assets) {
            Copy-Item assets release/ -Recurse
          }
          Compress-Archive -Path release/* -DestinationPath Nalei100Gram-windows-x86_64.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: Nalei100Gram-windows-x86_64.zip

  release:
    name: Publish Release
    needs:
      - build-linux
      - build-windows

    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Nalei100Gram 0.9.1-b
          tag_name: build
          prerelease: true
          generate_release_notes: true
          files: release-assets/*
