
name: Build and Release

on:
  push:
    tags:
      - 'build'

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux x86_64
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
        sudo apt-get update
        sudo apt-get install -y \
         build-essential \
         pkg-config \
         libasound2-dev \
         libpulse-dev \
         libxkbcommon-dev \
         libwayland-dev \
         libx11-dev \
         libxdo-dev \
         libdbus-1-dev \
         libfontconfig1-dev \
         libgtk-3-dev \
         libayatana-appindicator3-dev \
         librsvg2-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release

      - name: Package
        run: |
          mkdir -p release
          cp target/release/nalei100gram release/

          if [ -d assets ]; then
            cp -r assets release/
          fi

          tar -czf Nalei100Gram-linux-x86_64.tar.gz \
            -C release .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: Nalei100Gram-linux-x86_64.tar.gz

  build-windows:
    name: Build Windows x86_64
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release

          Copy-Item target/release/nalei100gram.exe release/

          if (Test-Path assets) {
            Copy-Item assets release/ -Recurse
          }

          Compress-Archive `
            -Path release/* `
            -DestinationPath Nalei100Gram-windows-x86_64.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: Nalei100Gram-windows-x86_64.zip

  release:
    name: Publish GitHub Release
    needs:
      - build-linux
      - build-windows

    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Nalei100Gram Build
          tag_name: build
          prerelease: true
          generate_release_notes: true
          files: release-assets/*
