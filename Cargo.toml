[package]
name = "nalei100gram"
version = "0.7.0"
edition = "2024"

[features]
default = ["linux-tray"]
linux-tray = ["tray-icon/ksni"]
windows-tray = []

[dependencies]
chrono = "0.4.45"
eframe = {version="0.36.1",features = ["wgpu"]}


egui_extras = { version = "0.36.1", features = ["image"] }


sqlx = {version="0.9.0",features=["sqlite","runtime-tokio"]}

teloxide = { version = "0.13", features = ["macros"] }
tokio = { version = "1", features = ["full"] }

image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }

log = "0.4"
env_logger = "0.11"

rodio = "0.22.2"
tray-icon = { version = "0.25.1", default-features = false }
open = "5.4.4"
volumecontrol = "0.1.4"
arboard = "3.7.0"

toml = "1.1"
serde = { version = "1.0", features = ["derive"] }