[package]
name = "nalei100gram"
version = "0.8.6"
edition = "2024"

[features]
default = ["linux-tray"]
linux-tray = ["tray-icon/ksni"]
windows-tray = []

[dependencies]
chrono = "0.4.45"
eframe = {version="0.37.0",features = ["wgpu"]}

egui_extras = { version = "0.37.0", features = ["image"] }
egui_material_icons = "0.9.0"

sqlx = {version="0.9.0",features=["sqlite","runtime-tokio"]}

teloxide = { version = "0.13", features = ["macros"] }
tokio = { version = "1", features = ["full"] }

image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }

log = "0.4"
env_logger = "0.11"

rodio = { version = "0.22.0",  features = ["symphonia-all"] }
symphonia = { version = "0.5", features = ["all"] }
symphonia-adapter-libopus = "0.2"

tray-icon = { version = "0.25.1", default-features = false }
open = "5.4.4"
volumecontrol = "0.1.4"
arboard = { version = "3.7.0", features = ["image-data"] }

toml = "1.1"
serde = { version = "1.0", features = ["derive"] }

async-trait = "0.1.92"
anyhow = "1.0.104"
rfd = "0.18.0"
